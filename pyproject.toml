[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlab"
version = "0.1.0"
description = "Decision-tree experiment lab: randomized block plans, an unattended runner, paired statistics, periodic AI analysis, local reports and a live dashboard."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
xlab = "xlab.cli:main"

[tool.setuptools.packages.find]
include = ["xlab*"]

[tool.setuptools.package-data]
"xlab" = ["examples/*.toml", "examples/*/*/*.toml"]
"xlab.dashboard" = ["static/*"]
